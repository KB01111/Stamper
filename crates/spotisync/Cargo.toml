[package]
name = "spotisync"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Lossless playlist sync engine for Spotifast"

[dependencies]
# Async trait object support for Provider and PlaylistSource.
async-trait = "0.1"
bytes = "1"
http = "1"
log = "0.4"
# Pure-Rust FLAC stream info inspection and Vorbis/picture tagging.
lofty = "0.25"
md-5 = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }
# Bundled SQLite so sync state works identically without system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }

[dev-dependencies]
tempfile = "3"
